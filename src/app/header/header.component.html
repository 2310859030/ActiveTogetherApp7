<div class="header-container">
  <h1 class="header-title">{{ title }}</h1>
  <div class="header-image" [style.backgroundImage]="'url(' + imagePath + ')'"></div>
  <div class="nav-links">
    <!-- Dashboard Button -->
    <button
      mat-flat-button
      color="primary"
      [routerLink]="'/dashboard'"
      routerLinkActive="active-button"
      [routerLinkActiveOptions]="{ exact: true }">
      Dashboard
    </button>

    <!-- About Button -->
    <button
      mat-flat-button
      color="primary"
      [routerLink]="'/about'"
      routerLinkActive="active-button"
      [routerLinkActiveOptions]="{ exact: true }">
      About
    </button>
  </div>
</div>
