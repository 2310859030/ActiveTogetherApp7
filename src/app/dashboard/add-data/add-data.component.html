<div class="form-container">
  <h2>Zum Kurs anmelden!</h2>
  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">

    <mat-form-field>
      <mat-label for="name">Name</mat-label>
      <input matInput id="name" formControlName="name"/>
      <mat-error *ngIf="registrationForm.get('name')?.invalid && registrationForm.get('name')?.touched">
        Bitte Name eintragen.
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label for="birthdate">Geburtsdatum</mat-label>
      <input matInput id="birthdate" [matDatepicker]="picker" formControlName="birthdate"
             [value]="registrationForm.get('birthdate')?.value | date:'yyyy-MM-dd'"/>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="registrationForm.get('birthdate')?.invalid && registrationForm.get('birthdate')?.touched">Bitte
        Geburtsdatum auswählen.
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label for="courseId">Kurs auswählen</mat-label>
      <select matNativeControl id="courseId" formControlName="courseId" required>
        <option value="" disabled></option>
        <option *ngFor="let course of storeService.courses" [value]="course.id">{{ course.name }}</option>
      </select>
      <mat-error *ngIf="registrationForm.get('courseId')?.invalid && registrationForm.get('courseId')?.touched">Bitte
        Kurs auswählen.
      </mat-error>
    </mat-form-field>

    <section>
      <mat-checkbox formControlName="newsletter">
        Ich möchte den Newsletter mit neuen Kursangeboten erhalten.
      </mat-checkbox>
    </section>

    <section>
      <div class="form-group">
        <button mat-flat-button color="primary" type="submit">Erfassen</button>
      </div>
    </section>

  </form>
  <div class="modal show" tabindex="-1" role="dialog" [style.display]="showModal ? 'block' : 'none'"
       (click)="closeModal()"
       style="position: absolute; top: 0; left: 0; width:100%; height:100%; background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered" role="document" (click)="$event.stopPropagation()"
         style="max-width:90%; margin:auto;">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Erfolg</h5>
          <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Sie haben sich erfolgreich zum Kurs angemeldet.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" (click)="closeModal()">OK</button>
        </div>
      </div>
    </div>
  </div>
</div>
